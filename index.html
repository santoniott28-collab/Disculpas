<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discúlpame porfa mi ñiña</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ffe6ea 0%, #ffc0cb 50%, #ffb6c1 100%);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            color: #5a2a3a;
        }

        /* Elementos flotantes de fondo */
        .background-decorations {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        .floating-item {
            position: absolute;
            font-size: 24px;
            animation: float 6s ease-in-out infinite alternate;
            opacity: 0.6;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-25px) rotate(15deg); }
        }

        /* Tarjeta Principal */
        .card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 40px 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(219, 112, 147, 0.25);
            border: 2px solid rgba(255, 182, 193, 0.8);
            position: relative;
            z-index: 10;
        }

        .flower-header {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .title {
            font-family: 'Great Vibes', cursive;
            font-size: 2.8rem;
            color: #d81b60;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .message {
            font-size: 1rem;
            line-height: 1.6;
            color: #6d3345;
            margin-bottom: 20px;
        }

        .heart-icon {
            color: #e91e63;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Cuadro pequeño para la foto */
        .photo-frame {
            margin: 15px auto 10px auto;
            width: 150px;
            height: 150px;
            border-radius: 20px;
            padding: 6px;
            background: linear-gradient(45deg, #ff80ab, #ff4081);
            box-shadow: 0 8px 20px rgba(233, 30, 99, 0.25);
            transition: transform 0.3s ease;
        }

        .photo-frame:hover {
            transform: scale(1.05) rotate(-2deg);
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 14px;
        }

        .photo-caption {
            font-size: 0.88rem;
            color: #ad1457;
            font-style: italic;
            margin-top: 8px;
            font-weight: 500;
        }

        /* Botón Interactivo */
        .btn-forgive {
            margin-top: 22px;
            background: linear-gradient(45deg, #e91e63, #ff4081);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(233, 30, 99, 0.3);
            transition: all 0.3s ease;
        }

        .btn-forgive:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(233, 30, 99, 0.4);
            background: linear-gradient(45deg, #d81b60, #f50057);
        }

        .footer-decor {
            margin-top: 20px;
            font-size: 20px;
            letter-spacing: 6px;
        }
    </style>
</head>
<body>

    <!-- Decoraciones flotantes en el fondo -->
    <div class="background-decorations">
        <span class="floating-item" style="top: 10%; left: 8%;">🌸</span>
        <span class="floating-item" style="top: 20%; right: 10%;">💖</span>
        <span class="floating-item" style="top: 70%; left: 12%;">🌺</span>
        <span class="floating-item" style="top: 80%; right: 15%;">💕</span>
        <span class="floating-item" style="top: 45%; left: 5%;">🌷</span>
        <span class="floating-item" style="top: 50%; right: 8%;">✨</span>
    </div>

    <!-- Tarjeta Principal -->
    <div class="card">
        <div class="flower-header">🌸 🌹 🌸</div>
        
        <h1 class="title">Discúlpame porfa mi ñiña</h1>
        
        <p class="message">
            No me gusta estar mal contigo. Te pido una disculpa sincera desde el fondo de mi corazón. No fue mi intención que te tomaras las cosas así. <span class="heart-icon">❤️</span>
        </p>

        <!-- Cuadro pequeño con la foto -->
       <div class="photo-frame">
    		<img src="imagena.jpg" alt="Foto adjunta">
	</div>
        <p class="photo-caption"> 🥺💖</p>

        <button class="btn-forgive" onclick="alert('¡Gracias mi ñiña! ❤️✨')">
            ¿Me perdonas verdad? 🌹
        </button>

        <div class="footer-decor">🌷 💌 🌸</div>
    </div>

</body>
</html>
